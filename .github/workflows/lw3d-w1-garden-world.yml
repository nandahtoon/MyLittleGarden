name: LW3D-W1 Garden World and Native QA

on:
  push:
    branches:
      - "feat/lw3d-w1-**"
  pull_request:
    paths:
      - "scripts/worlds/**"
      - "scripts/gameplay/rainbow_forest_v1.gd"
      - "assets/models/kenney_nature/**"
      - "tools/lw3d_w1_world_test.gd"
      - ".github/workflows/lw3d-w1-garden-world.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  godot-world-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Pinned Godot 4.4.1
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.4.1
          use-dotnet: false
          include-templates: false
      - name: Validate old source and import actual 3D models
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/validate_structure.py
          godot --headless --path . --import 2>&1 | tee w1-import.log
          godot --headless --path . res://scenes/worlds/rainbow_forest_v1.tscn --quit-after 90 2>&1 | tee w1-scene.log
      - name: Run terrain, GLB and mission regressions
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path . --script tools/lw3d_w1_world_test.gd 2>&1 | tee w1-world-test.log
          godot --headless --path . --script tools/lw3d_v1_test.gd 2>&1 | tee w1-v1-test.log
          godot --headless --path . --script tools/lw3d_u1_test.gd 2>&1 | tee w1-u1-test.log
          grep -q "PASS LW3D-W1" w1-world-test.log
          grep -q "PASS LW3D-V1" w1-v1-test.log
          grep -q "PASS LW3D-U1" w1-u1-test.log
          if grep -Ein 'SCRIPT ERROR|Parse Error|Parser Error|Invalid call|Invalid get index|Failed loading resource|FAIL LW3D' w1-*.log; then
            echo "LW3D-W1 QA detected a scene, model import or regression failure"
            exit 1
          fi
      - name: Upload logs for audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LW3D-W1-Godot-evidence
          path: w1-*.log
          if-no-files-found: ignore
          retention-days: 14

  android-w1-debug-apk:
    needs: godot-world-regression
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Android SDK
        uses: android-actions/setup-android@v4
      - name: Android SDK packages
        run: sdkmanager --install "platform-tools" "build-tools;34.0.0" "platforms;android-34"
      - name: Godot 4.4.1 with Android export templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.4.1
          use-dotnet: false
          include-templates: true
      - name: Prepare isolated scene and app package in runner only
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path("project.godot")
          s = p.read_text()
          old = 'run/main_scene="res://scenes/main.tscn"'
          assert old in s
          p.write_text(s.replace(old, 'run/main_scene="res://scenes/worlds/rainbow_forest_v1.tscn"'))
          p = Path("export_presets.cfg")
          s = p.read_text()
          old = 'package/unique_name="io.github.nandahtoon.mylittlegarden"'
          assert old in s
          s = s.replace(old, 'package/unique_name="io.github.nandahtoon.mylittlegarden.rainbow.w1"')
          s = s.replace('package/name="Little Wonder Garden"', 'package/name="Little Wonder Garden W1 QA"')
          p.write_text(s)
          PY
          mkdir -p build "$HOME/.config/godot"
          godot --headless --path . --import
          cat > "$HOME/.config/godot/editor_settings-4.4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/android_sdk_path = "$ANDROID_SDK_ROOT"
          EOF
          keytool -genkeypair -noprompt -keystore "$RUNNER_TEMP/lw3d-w1-debug.keystore" -alias androiddebugkey -storepass android -keypass android -dname "CN=Android Debug,O=MyLittleGarden,C=US" -keyalg RSA -keysize 2048 -validity 365
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$RUNNER_TEMP/lw3d-w1-debug.keystore" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android" >> "$GITHUB_ENV"
      - name: Export test-only Android APK
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path . --export-debug Android build/LW3D-W1-Garden-World-debug.apk 2>&1 | tee build/w1-apk-export.log
          test -s build/LW3D-W1-Garden-World-debug.apk
          sha256sum build/LW3D-W1-Garden-World-debug.apk | tee build/SHA256SUMS.txt
      - name: Upload supervised QA APK and checksum (not public store release)
        uses: actions/upload-artifact@v4
        with:
          name: LW3D-W1-Garden-World-Android-QA-APK
          path: |
            build/LW3D-W1-Garden-World-debug.apk
            build/SHA256SUMS.txt
            build/w1-apk-export.log
          retention-days: 14
