name: LW3D V1 Public QA Preview

on:
  push:
    branches: ["feat/lw3d-v1-rainbow-nova-20261121"]
    paths: [".github/workflows/lw3d-preview-release.yml"]

permissions:
  contents: write
  actions: read

jobs:
  publish-pinned-qa-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_SHA: "4be29595ac9a9e51fd2121e012fb9c79a5a36f36"
      TEST_RUN: "44963173102"
      PREVIEW_TAG: "lw3d-v1-qa-preview-20261121"
    steps:
      - name: Fetch already-verified Android APK and Nova GLB
        shell: bash
        run: |
          set -euo pipefail
          gh run download "$TEST_RUN" -R "$GITHUB_REPOSITORY" --name LW3D-V1-Rainbow-Android-APK --dir release_bundle
          gh run download "$TEST_RUN" -R "$GITHUB_REPOSITORY" --name LW3D-V1-Nova-GLB --dir model_bundle
          expected_apk=$(cut -d' ' -f1 release_bundle/LW3D-V1-Rainbow-debug.apk.sha256)
          actual_apk=$(sha256sum release_bundle/LW3D-V1-Rainbow-debug.apk | cut -d' ' -f1)
          test "$expected_apk" = "$actual_apk"
          expected_glb=$(cut -d' ' -f1 model_bundle/nova.glb.sha256)
          actual_glb=$(sha256sum model_bundle/nova.glb | cut -d' ' -f1)
          test "$expected_glb" = "$actual_glb"
          test -s release_bundle/LW3D-V1-Rainbow-debug.apk
          test -s model_bundle/nova.glb
      - name: Publish clear QA-only GitHub prerelease
        shell: bash
        run: |
          set -euo pipefail
          cat > preview-notes.md <<EOF
          # Little Wonder Garden — Rainbow Forest Developer Preview

          **DEVELOPER QA PREVIEW ONLY — NOT A PRODUCTION GAME OR GOOGLE PLAY RELEASE.**
          Source commit: $SOURCE_SHA.

          Includes native Godot 3D Nova, a Rainbow Forest adventure with Shape / Nature solution paths, local mission save and Rest/Garden controls. The Android package name is io.github.nandahtoon.mylittlegarden.rainbow and does not replace the original 2D app.

          **Not yet verified:** physical Android screen rendering, touch camera comfort, FPS/thermals, child usability or iPad. For supervised test devices only. Ephemeral debug signing can prevent upgrades with future debug builds.

          See: https://github.com/nandahtoon/MyLittleGarden/pull/18
          EOF
          gh release create "$PREVIEW_TAG" \
            release_bundle/LW3D-V1-Rainbow-debug.apk \
            release_bundle/LW3D-V1-Rainbow-debug.apk.sha256 \
            model_bundle/nova.glb \
            model_bundle/nova.glb.sha256 \
            -R "$GITHUB_REPOSITORY" \
            --target "$SOURCE_SHA" \
            --title "LW3D V1 Rainbow QA Preview (untested)" \
            --notes-file preview-notes.md --prerelease
          gh release view "$PREVIEW_TAG" -R "$GITHUB_REPOSITORY" --json url,tagName,isPrerelease,assets
      - name: Try public short link (optional)
        shell: bash
        run: |
          set -euo pipefail
          target="https://github.com/$GITHUB_REPOSITORY/releases/download/$PREVIEW_TAG/LW3D-V1-Rainbow-debug.apk"
          short=$(curl --fail --silent --show-error --max-time 15 --get \
            --data-urlencode "format=simple" \
            --data-urlencode "shorturl=LWG3DV1" \
            --data-urlencode "url=$target" https://is.gd/create.php || true)
          if [[ "$short" != https://is.gd/* ]]; then
            short=$(curl --fail --silent --show-error --max-time 15 --get \
              --data-urlencode "format=simple" \
              --data-urlencode "url=$target" https://is.gd/create.php || true)
          fi
          if [[ "$short" == https://is.gd/* ]]; then
            echo "VERIFIED_SHORT_LINK=$short"
          else
            echo "Shortener unavailable; use public GitHub link: $target"
          fi
